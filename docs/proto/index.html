<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f2a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シロアリボージョ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>シロアリボージョ 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 縦長の対戦マット。上が相手（山札・裏向きの手札・情報バー）、中央が8か所の場（家）、下が自分（情報バー・山札・扇形の手札）。開発用設定はマットの下 */
:root{
  --bg:#2f2a24; --mat:#f3ead8; --mat-line:#dccdb1; --paper:#fffdf8; --ink:#2b231c; --muted:#6f6254; --line:#ddd1bd;
  --yamato:#c27a2c; --ie:#b8402f; --kanzai:#6d52a6;
  --t:#b8402f; --t-soft:#f3d9d2; --d:#2b7d72; --d-soft:#d6ece8;
  --guard:#2b7d72; --spray:#2f6fa8; --event:#d0782c; --neutral:#6b7480;
  --wet:#4f8fb5; --dry:#a9855a; --upper:#6c7a88; --tree:#c9962c;
  --danger:#bf3a2a; --gold:#e0a82e; --back1:#5b3b25; --back2:#7a5235;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --cw:92px; --ch:128px;
  color-scheme:light;
}
@media (min-width:520px){:root{--cw:104px;--ch:144px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 24px max(0px,env(safe-area-inset-left,0px))}
button,select,input{font:inherit;color:inherit}
button:focus-visible,.tile.target:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== mat ===== */
.mat{position:relative;max-width:500px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,transparent 0 118px,rgba(120,95,60,.18) 119px 121px,transparent 122px),
    linear-gradient(180deg,var(--opp-soft,var(--t-soft)) 0,var(--mat) 34%,var(--mat) 66%,var(--me-soft,var(--d-soft)) 100%);
  padding:max(8px,env(safe-area-inset-top,0px)) 8px 0}
.mat::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(120,95,60,.18);pointer-events:none}

/* opponent row */
.opp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;min-height:78px}
.pile{position:relative;width:46px;height:64px;flex:none}
.pile .back{position:absolute;inset:0;border-radius:6px}
.pile .back:nth-child(1){transform:translate(3px,3px)}.pile .back:nth-child(2){transform:translate(1.5px,1.5px)}
.pile b{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;line-height:1.5;white-space:nowrap}
.pile.empty .back{opacity:.25}
.disc{position:relative;width:46px;height:64px;border:2px dashed rgba(90,70,50,.35);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);flex:none;text-align:center;line-height:1.2}
.disc b{display:block;font-size:13px;color:var(--ink)}
.back{background:
   radial-gradient(circle at 50% 50%,#e9c98f 0 7px,transparent 8px),
   radial-gradient(circle at 50% 50%,transparent 0 12px,rgba(233,201,143,.55) 13px 14px,transparent 15px),
   repeating-linear-gradient(60deg,var(--back1) 0 6px,var(--back2) 6px 12px);
  border:2px solid #e9c98f;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.oppside{display:flex;flex-direction:column;gap:6px;min-width:0}
.ohand{position:relative;height:40px}
.ohand .back{position:absolute;top:-18px;width:30px;height:42px;border-radius:5px;transform-origin:50% 0}
.bar{display:flex;align-items:center;gap:8px;background:rgba(255,253,248,.92);border-radius:12px;padding:4px 10px;border:2px solid var(--sidec,var(--line));min-width:0}
.bar .nm{font-family:var(--font-display);font-weight:900;font-size:14px;white-space:nowrap}
.bar .sub{font-size:10px;color:var(--muted);white-space:nowrap}
.bar .goal{margin-left:auto;display:flex;align-items:center;gap:3px;font-size:10px;color:var(--muted);white-space:nowrap}
.bar .goal svg{width:15px;height:15px;color:var(--line)}
.bar .goal svg.on{color:var(--danger)}
.meter{width:56px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sidec)}
.think{font-size:11px;font-weight:700;color:var(--sidec)}
@media (prefers-reduced-motion:no-preference){.think{animation:blink 1s ease-in-out infinite alternate}}
@keyframes blink{from{opacity:.35}to{opacity:1}}

/* feed */
.feed{margin:8px auto 4px;max-width:100%;border:0;background:rgba(43,35,28,.82);color:#fff;font-size:11.5px;border-radius:99px;padding:2px 12px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.feed::before{content:"▸ ";opacity:.6}

/* field */
.field{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-content:center;flex:1;padding-block:4px}
.center{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;text-align:center}
.center .homes{display:flex;gap:4px;align-items:center;background:rgba(255,253,248,.9);border-radius:99px;padding:2px 10px;border:2px solid var(--mat-line)}
.center .homes span{font-size:10px;color:var(--muted);margin-right:2px}
.center .homes svg{width:16px;height:16px;color:var(--line)}
.center .homes svg.on{color:var(--danger)}
.center .note{font-size:10.5px;font-weight:700;color:#8a6213}
.tile{--z:var(--dry);position:relative;min-width:0;aspect-ratio:3/4;background:var(--paper);border:2px solid var(--z);border-radius:10px;padding:0 0 4px;display:flex;flex-direction:column;overflow:visible;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tile.wet{--z:var(--wet)}.tile.upper{--z:var(--upper)}.tile.tree{--z:var(--tree);border-style:dashed;background:#fff8e6}
.tile .top{background:var(--z);color:#fff;border-radius:7px 7px 0 0;padding:3px 4px 2px;display:flex;align-items:center;gap:3px;min-height:30px}
.tile .top svg{width:12px;height:12px;flex:none}
.tile .top b{font-family:var(--font-display);font-weight:900;font-size:10.5px;line-height:1.15;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.tile .meta{display:flex;align-items:center;gap:2px;padding:3px 5px 0;flex-wrap:wrap}
.dot{width:15px;height:15px;border-radius:50%;color:#fff;font-size:9px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.dot.yamato{background:var(--yamato)}.dot.ie{background:var(--ie)}.dot.kanzai{background:var(--kanzai)}
.tile .zl{font-size:9px;color:var(--muted);margin-left:auto;white-space:nowrap}
.stack{flex:1;display:flex;align-items:center;justify-content:center;padding:2px 4px;min-height:0}
.mini{position:relative;flex:none;width:22px;height:30px;border-radius:4px;background:var(--c);border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;line-height:1}
.mini+.mini{margin-left:-9px}
.mini svg{width:14px;height:14px}
.mini.shield{box-shadow:0 0 0 2px var(--spray)}
.mini.rise{outline:2px solid var(--gold)}
.prog{display:flex;align-items:center;gap:2px;padding:0 5px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--danger)}
.prog span{font-size:9.5px;color:var(--muted);margin-left:2px;white-space:nowrap}
.badges{position:absolute;right:-5px;top:20px;display:flex;flex-direction:column;gap:2px;z-index:2}
.badge{display:flex;align-items:center;gap:1px;border-radius:99px;color:#fff;font-size:10px;font-weight:900;padding:1px 5px 1px 3px;box-shadow:0 1px 2px rgba(0,0,0,.3);line-height:1.3}
.badge svg{width:11px;height:11px}
.badge.barrier{background:var(--guard)}.badge.bait{background:var(--spray)}.badge.out{background:var(--event)}
.tile.done{background:#fbe3dd;border-color:var(--danger)}
.tile.done::after{content:"完全侵食";position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--font-display);font-weight:900;font-size:13px;color:var(--danger);border:2px solid var(--danger);border-radius:6px;padding:0 4px;background:rgba(255,255,255,.85);white-space:nowrap}
.tile.tree.done::after{content:"倒れた"}
.tile.target{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,168,46,.55)}
.tile.target::before{content:"ここ";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:var(--gold);color:#fff;border-radius:99px;padding:0 8px;z-index:3}
.tile.fx{box-shadow:0 0 0 4px rgba(191,58,42,.45)}
@media (prefers-reduced-motion:no-preference){
  .tile.target{animation:glow 1s ease-in-out infinite alternate}
  .tile.fx{animation:pop .8s ease-out}
}
@keyframes glow{from{box-shadow:0 0 0 2px rgba(224,168,46,.35)}to{box-shadow:0 0 0 6px rgba(224,168,46,.7)}}
@keyframes pop{0%{transform:scale(1.08)}100%{transform:none}}

/* my row */
.me{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.merow{display:flex;align-items:flex-end;gap:8px}
.merow .bar{flex:1}
.ap{display:flex;gap:3px;align-items:center}
.apbox:empty{display:none}
.apbox{flex:none;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:99px;padding:4px 6px}
.ap i{width:16px;height:16px;border-radius:50%;background:#e7dfcf;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ap i.on{background:radial-gradient(circle at 35% 35%,#ffe7a1,var(--gold) 60%,#b8861b);box-shadow:0 0 0 1px #b8861b}
.menu{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.menu svg{width:20px;height:20px}
.actions{display:flex;align-items:center;gap:6px;min-height:40px;flex-wrap:wrap}
.say{min-width:0;min-height:30px;background:rgba(255,253,248,.92);border-radius:10px;padding:3px 10px;font-size:12px;line-height:1.4;border:1px solid var(--line)}
.say b{font-family:var(--font-display);font-size:13px}
.say .d{color:var(--muted);display:block;font-size:11px}
.say .n{color:var(--danger);font-weight:700;font-size:11px}
.auto{display:flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 8px 3px 4px;cursor:pointer;font-size:11px;font-weight:700;flex:none}
.auto i{width:26px;height:16px;border-radius:99px;background:var(--line);position:relative;flex:none}
.auto i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.auto[aria-pressed="true"]{border-color:var(--gold)}
.auto[aria-pressed="true"] i{background:var(--gold)}
.auto[aria-pressed="true"] i::after{left:12px}
.end{flex:none;border:0;border-radius:12px;background:var(--sidec,var(--ink));color:#fff;font-family:var(--font-display);font-weight:900;font-size:14px;padding:9px 12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.end:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.mini-btn{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer}

/* hand (fan) */
.hand{position:relative;height:calc(var(--ch) + 50px);margin:0 -8px;padding-bottom:max(0px,env(safe-area-inset-bottom,0px))}
.card{--c:var(--neutral);position:absolute;bottom:10px;left:0;width:var(--cw);height:var(--ch);border:0;padding:0;cursor:pointer;border-radius:10px;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transform-origin:50% 100%;
  transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s,1));display:flex;flex-direction:column;overflow:hidden;text-align:left}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .18s ease-out,filter .18s}}
.card .face{position:absolute;inset:3px;border-radius:8px;background:
   radial-gradient(circle at 50% 46%,rgba(255,255,255,.85) 0 18%,transparent 52%),
   linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));display:flex;flex-direction:column}
.card .nm{padding:3px 4px 0 26px;font-family:var(--font-display);font-weight:900;font-size:12px;line-height:1.15;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);min-height:30px}
.card .art{flex:1;display:flex;align-items:center;justify-content:center;color:var(--c)}
.card .art svg{width:46%;height:auto;filter:drop-shadow(0 2px 0 rgba(255,255,255,.7))}
.card .lb{background:rgba(255,253,248,.92);margin:0 4px 4px;border-radius:5px;font-size:9.5px;font-weight:700;text-align:center;padding:1px 2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .gem{position:absolute;left:5px;top:5px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a1,var(--gold) 60%,#b8861b);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-family:var(--font-display);z-index:1;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.card.dim{filter:saturate(.35) brightness(.92)}
.card.opp{filter:grayscale(1) brightness(.85)}
.card.sel{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.4)}
.card:disabled{cursor:default}
@media (hover:hover){.card:not(:disabled):not(.sel):hover{--y2:-14px}}
.empty{position:absolute;left:0;right:0;top:40px;text-align:center;color:var(--muted);font-size:12px}

/* big reveal / banner */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:15;gap:8px}
.stage .bigcard{position:relative;--cw:150px;--ch:208px;width:var(--cw);height:var(--ch);border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
.stage .bigcard .face{position:absolute;inset:4px;border-radius:11px;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.85) 0 18%,transparent 52%),linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));display:flex;flex-direction:column}
.stage .bigcard .nm{padding:8px 8px 0 38px;font-family:var(--font-display);font-weight:900;font-size:18px;line-height:1.15;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);min-height:46px}
.stage .bigcard .gem{position:absolute;left:8px;top:8px;width:28px;height:28px;font-size:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a1,var(--gold) 60%,#b8861b);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:1}
.stage .bigcard .art{flex:1;display:flex;align-items:center;justify-content:center;color:var(--c)}
.stage .bigcard .art svg{width:50%;height:auto}
.stage .bigcard .lb{background:rgba(255,253,248,.94);margin:0 6px 6px;border-radius:7px;font-size:11px;padding:4px 6px;color:var(--ink);line-height:1.35}
.stage .cap{background:rgba(43,35,28,.88);color:#fff;border-radius:99px;padding:3px 14px;font-size:13px;font-weight:700}
.stage .banner{font-family:var(--font-display);font-weight:900;font-size:26px;color:#fff;background:var(--sidec,var(--ink));padding:8px 30px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:no-preference){
  .stage .bigcard{animation:deal .32s cubic-bezier(.2,1.4,.5,1)}
  .stage .banner{animation:deal .3s ease-out}
}
@keyframes deal{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(20,16,12,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:18px;padding:18px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;border:3px solid var(--mat-line)}
.sheet h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:19px}
.sheet p{margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-weight:500}
.opts .btn.on{border-color:var(--danger);background:#fbe3dd}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{text-align:left;border:3px solid var(--line);border-radius:16px;background:#fff;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pick button:hover{border-color:var(--gold)}
.pick b{font-family:var(--font-display);font-weight:900;font-size:17px}
.pick .t b{color:var(--t)}.pick .d b{color:var(--d)}
.pick span{font-size:11.5px;color:var(--muted)}
@media (max-width:360px){.pick{grid-template-columns:1fr}}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--font-display);font-weight:900;font-size:32px}
.result .big.win{color:var(--guard)}.result .big.lose{color:var(--danger)}
.rules{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted)}
.loglist{font-size:12px;display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.loglist li{border-left:4px solid var(--line);padding:1px 8px}
.loglist .t{border-left-color:var(--t)}.loglist .d{border-left-color:var(--d)}

/* dev panel */
details.dev{max-width:500px;margin:12px auto 0;background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:12px}
details.dev summary{cursor:pointer;font-weight:700;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row select,.row input,.cfg input{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
.row input,.cfg input{width:60px}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:8px}
.cfg .grp{grid-column:1/-1;font-weight:700;color:var(--muted);margin-top:6px}
.cfg label{display:flex;justify-content:space-between;align-items:center;gap:6px}
.res{margin-top:8px;overflow-x:auto}
.res table{border-collapse:collapse;width:100%}
.res td,.res th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;white-space:nowrap}
.res td.num{text-align:right}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bug" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M9 5 6 2M15 5l3-3"/><path d="M8 11H4M8 13l-3 3M16 11h4M16 13l3 3M9 9 5 7M15 9l4-2"/>
    </g>
    <g fill="currentColor"><circle cx="12" cy="6.5" r="2.6"/><ellipse cx="12" cy="11" rx="2.6" ry="2.2"/><ellipse cx="12" cy="17.3" rx="3.4" ry="4.6"/></g>

<template id="rulesTpl">
  <h3>ルール</h3>
  <ul class="rules">
    <li><b>シロアリ側の勝ち</b>：8か所のうち5か所を完全侵食する</li>
    <li><b>防除側の勝ち</b>：シロアリの山札が尽きるまで家を守りきる</li>
    <li>毎ターン行動力が3回復し、カード左上のコストを払って使う。余りは持ち越さない</li>
    <li>ターンの終わりに、手札が5枚になるまで山札から引く。1枚も使わなかったターンは、先に手札を1枚捨てて1枚引ける</li>
    <li>シロアリは3枚重なると完全侵食。同じ場所には1ターンに1枚まで</li>
    <li>置ける場所：ヤマトは水回り、カンザイは上部（梁・屋根裏）、イエはどこでも。場所の左上の丸印が置ける種類</li>
    <li>庭の枯れ木は特殊：4枚で倒れ、倒れると全ての場所が2枚で完全侵食になる</li>
    <li>羽アリ：次の自分のターンに女王アリになり、同じ種類の職アリを2枚手札に加える</li>
    <li>兵アリ：いる場所への薬剤散布を1回だけ防ぐ（ベイト工法は防げない）</li>
    <li>バリア工法：3ターンの間、シロアリを置けなくする</li>
    <li>ベイト工法：2回後の自分のターンに、その場所のヤマト・イエを全て駆除する（カンザイには効かない）</li>
    <li>大量発生：次の自分のターンまで、その場所に防除・駆除カードを置けなくする</li>
    <li>オート：オンにすると、自分のターンもCPUが代わりに遊びます</li>
  </ul>
  <button class="btn primary" data-close>閉じる</button>
</template>

<script>
/* ===== ENGINE ===== */
const SPECIES=[{id:'yamato',s:'ヤマト'},{id:'ie',s:'イエ'},{id:'kanzai',s:'カンザイ'}];
const CASTES={
  worker:{name:'職アリ',desc:'1枚分。基本の侵食カード'},
  soldier:{name:'兵アリ',desc:'1枚分。いるポイントへの薬剤散布を1回無効化'},
  alate:{name:'羽アリ',desc:'1枚分。次の自分のターンに女王アリになる'},
  queen:{name:'女王アリ',desc:'1枚分。なったとき同種の職アリを山札から2枚手札へ'}};
const DEF={};
SPECIES.forEach(sp=>Object.entries(CASTES).forEach(([c,v])=>{DEF[sp.id+'_'+c]={name:v.name+'-'+sp.s,kind:'termite',side:'t',species:sp.id,caste:c,target:'point',desc:v.desc,label:'シロアリ'}}));
Object.assign(DEF,{
  spray:{name:'薬剤散布',kind:'exterm',side:'d',target:'point',label:'駆除',desc:'指定ポイントのシロアリを1枚除去'},
  barrier:{name:'バリア工法',kind:'defense',side:'d',target:'point',label:'防除',desc:'指定ポイントに一定ターン、シロアリを置けなくする'},
  bait:{name:'ベイト工法',kind:'defense',side:'d',target:'point',label:'防除',desc:'2回後の自分のターン開始時に、指定ポイントのヤマト・イエを全て除去'},
  outbreak:{name:'大量発生',kind:'event',side:'t',target:'point',label:'イベント（シロアリ側）',desc:'次の自分のターンまで、指定ポイントに防除・駆除カードを置けなくする'},
  furniture:{name:'輸入家具購入',kind:'event',side:'t',target:'none',label:'イベント（シロアリ側）',desc:'山札からカンザイシロアリを1枚手札へ'},
  reinforce:{name:'増援',kind:'neutral',side:'n',target:'none',label:'中立',desc:'山札から2枚ドロー'},
  scout:{name:'偵察',kind:'neutral',side:'n',target:'none',label:'中立',desc:'相手の手札を全て見る'},
  disrupt:{name:'妨害',kind:'neutral',side:'n',target:'none',label:'中立',desc:'相手の手札をランダムに1枚捨てさせる'},
  foresight:{name:'予知',kind:'neutral',side:'n',target:'none',label:'中立',desc:'自分の山札の上3枚から1枚を手札に加え、残りを好きな順で山札の下へ'}
});
const DEFAULT_COUNTS={
  t:{yamato_alate:1,yamato_soldier:2,yamato_worker:4,ie_alate:1,ie_soldier:5,ie_worker:12,kanzai_alate:1,kanzai_soldier:2,kanzai_worker:4,
     outbreak:6,furniture:3,reinforce:5,scout:1,disrupt:1,foresight:2},
  d:{spray:15,barrier:9,bait:7,reinforce:7,scout:4,disrupt:4,foresight:4}};
const POINTS=[
  {name:'浴室・洗面所',zone:'wet'},{name:'キッチン',zone:'wet'},
  {name:'床下・土台',zone:'dry'},{name:'玄関・框',zone:'dry'},
  {name:'庭の枯れ木',zone:'dry',tree:true},{name:'ウッドデッキ',zone:'dry'},
  {name:'梁・柱',zone:'upper'},{name:'屋根裏・天井',zone:'upper'}];
const ZONE={wet:'水回り',dry:'乾燥箇所',upper:'上部'};
const SIDE={t:'シロアリ側',d:'防除側'};
const MODE={shared:'共有',splitT:'分割・シロアリ山札',rounds:'分割・ラウンド制'};
const WIN_POINTS=5, HAND_LIMIT=7, HAND_SIZE=5;
const DEFAULT_COSTS={worker:1,soldier:2,alate:2,spray:1,barrier:2,bait:2,outbreak:1,furniture:1,reinforce:1,scout:1,disrupt:1,foresight:1};
const COST_LABEL={worker:'職アリ',soldier:'兵アリ',alate:'羽アリ',spray:'薬剤散布',barrier:'バリア工法',bait:'ベイト工法',outbreak:'大量発生',furniture:'輸入家具購入',reinforce:'増援',scout:'偵察',disrupt:'妨害',foresight:'予知'};
let UID=0;
const mk=(key,home)=>({uid:++UID,key,home});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const opp=s=>s==='t'?'d':'t';

function newGame(counts,opts={}){
  const mode=opts.deckMode||'shared';
  const build=h=>{const a=[];for(const k in counts[h]){if(DEF[k].caste==='queen')continue;for(let i=0;i<(counts[h][k]||0);i++)a.push(mk(k,h))}return a};
  let decks,discards;
  if(mode==='shared'){const a=shuffle([...build('t'),...build('d')]);const ds=[];decks={t:a,d:a};discards={t:ds,d:ds}}
  else{decks={t:shuffle(build('t')),d:shuffle(build('d'))};discards={t:[],d:[]}}
  const st={mode,rounds:opts.rounds||15,decks,discards,hands:{t:[],d:[]},treeFallen:false,winner:null,winReason:'',
    queens:{yamato:1,ie:1,kanzai:1},costOn:!!opts.costOn,apMax:opts.ap||3,ap:0,used:0,costs:opts.costs||DEFAULT_COSTS,
    points:POINTS.map(()=>({cards:[],complete:false,barrier:0,outbreak:false,baits:[]})),barrierTurns:opts.barrierTurns||3,baitDelay:opts.baitDelay||2,treeReq:opts.treeReq||4,reshuffle:opts.reshuffle!==false,
    placed:POINTS.map(()=>({t:0,d:0})),own:{t:0,d:0},turnSide:Math.random()<.5?'t':'d',turnNo:0,
    log:[],quiet:!!opts.quiet,human:opts.human||null,
    stats:{tPlaced:0,removed:0,mulligans:0,queens:0,shields:0,baitKills:0,reshuffles:0,dead:{t:0,d:0},deadN:{t:0,d:0},hand:{t:0,d:0},plays:{t:0,d:0}}};
  draw(st,'t',5);draw(st,'d',5);
  log(st,'s',`コイントスの結果、${SIDE[st.turnSide]}が先攻`);
  return st;
}
function log(st,cls,msg){if(st.quiet)return;st.log.unshift({cls,msg});if(st.log.length>150)st.log.pop()}
const canReshuffle=(st,side)=>st.reshuffle&&(st.mode==='rounds'||(st.mode==='splitT'&&side==='d'));
function toDiscard(st,c){if(c.key.endsWith('_queen'))return;st.discards[c.home].push({uid:c.uid,key:c.key,home:c.home})}
function draw(st,side,n){let c=0;const deck=st.decks[side];
  for(let i=0;i<n;i++){
    if(!deck.length&&canReshuffle(st,side)&&st.discards[side].length){deck.push(...shuffle(st.discards[side].splice(0)));st.stats.reshuffles++;log(st,side,`${SIDE[side]}の山札が尽きたので、捨て札を混ぜ直した`)}
    if(!deck.length)break;st.hands[side].push(deck.pop());c++}
  return c}
function searchDeck(st,side,pred,n){const deck=st.decks[side];let got=0;for(let i=deck.length-1;i>=0&&got<n;i--){if(pred(deck[i])){st.hands[side].push(deck.splice(i,1)[0]);got++}}if(got)shuffle(deck);return got}
const usable=(side,card)=>DEF[card.key].side===side||DEF[card.key].side==='n';
function speciesAllowed(i,sp){const z=POINTS[i].zone;if(sp==='ie')return true;if(sp==='kanzai')return z==='upper';return z==='wet'}
const required=(st,i)=>(i!==undefined&&POINTS[i].tree&&!st.treeFallen)?st.treeReq:(st.treeFallen?2:3);
const completedCount=st=>st.points.filter(p=>p.complete).length;
function checkCompletions(st){
  let changed=true;
  while(changed){changed=false;
    st.points.forEach((p,i)=>{if(!p.complete&&p.cards.length>0&&p.cards.length>=required(st,i)){p.complete=true;changed=true;p.baits=[];p.barrier=0;p.outbreak=false;
      log(st,'t',`${POINTS[i].name}が完全侵食された`);
      if(POINTS[i].tree&&!st.treeFallen){st.treeFallen=true;log(st,'t','枯れ木が倒れた。完全侵食に必要な枚数が2枚になる')}}})}
  if(!st.winner&&completedCount(st)>=WIN_POINTS){st.winner='t';st.winReason=`${WIN_POINTS}ポイントを完全侵食`;log(st,'t','シロアリ側の勝利')}
}
function legal(st,side,key,i){
  const p=st.points[i],d=DEF[key];if(p.complete)return false;
  if(d.kind==='termite')return speciesAllowed(i,d.species)&&st.placed[i].t<1&&!p.barrier;
  if(key==='outbreak')return !p.outbreak;
  if(d.kind==='defense'||d.kind==='exterm'){
    if(p.outbreak)return false;
    if(key==='spray')return p.cards.length>0;
    if(key==='bait')return p.baits.length===0;
    if(key==='barrier')return !p.barrier;
    return true}
  return false}
const targetsFor=(st,side,key)=>POINTS.map((_,i)=>i).filter(i=>legal(st,side,key,i));
const foresightDeck=(st,side)=>st.decks[side];
const costOf=(st,key)=>{const d=DEF[key];return d.kind==='termite'?st.costs[d.caste]??1:st.costs[key]??1};
function canPlay(st,side,card){
  if(st.winner||st.turnSide!==side||!usable(side,card))return false;
  const d=DEF[card.key];if(st.costOn&&costOf(st,card.key)>st.ap)return false;
  if(d.target==='point')return targetsFor(st,side,card.key).length>0;
  if(card.key==='disrupt'||card.key==='scout')return st.hands[opp(side)].length>0;
  if(card.key==='foresight')return foresightDeck(st,side).length>0;
  if(card.key==='reinforce'||card.key==='furniture')return st.decks[side].length>0||(canReshuffle(st,side)&&st.discards[side].length>0);
  return true}
function refill(st){const side=st.turnSide;if(st.winner)return 0;const need=Math.max(0,HAND_SIZE-st.hands[side].length);if(!need)return 0;const g=draw(st,side,need);log(st,side,`補充：手札が${HAND_SIZE}枚になるよう${g}枚引いた`);return g}
function mulligan(st,side,uid){const h=st.hands[side];const k=h.findIndex(c=>c.uid===uid);if(k<0)return false;const c=h.splice(k,1)[0];toDiscard(st,c);draw(st,side,1);st.stats.mulligans++;
  log(st,side,`手詰まりのため「${DEF[c.key].name}」を捨てて1枚引いた`);return true}
function removeLast(st,i){const c=st.points[i].cards.pop();if(c){toDiscard(st,c);st.stats.removed++}return c}
function play(st,side,uid,targets=[]){
  const hand=st.hands[side];const idx=hand.findIndex(c=>c.uid===uid);if(idx<0)return null;
  const card=hand.splice(idx,1)[0];const d=DEF[card.key];const res={};const nm=i=>POINTS[i].name;st.stats.plays[side]++;st.used++;if(st.costOn)st.ap-=costOf(st,card.key);
  if(d.kind==='termite'){const i=targets[0],p=st.points[i];
    p.cards.push({uid:card.uid,key:card.key,home:card.home,shield:d.caste==='soldier',promoteAt:d.caste==='alate'?st.own.t+1:0});
    st.placed[i].t++;st.stats.tPlaced++;
    log(st,side,`${d.name}を${nm(i)}に置いた（${p.cards.length}/${required(st,i)}）`);checkCompletions(st);return res}
  switch(card.key){
    case 'spray':{const i=targets[0],p=st.points[i];st.placed[i].d++;
      const s=p.cards.find(c=>c.shield);
      if(s){s.shield=false;st.stats.shields++;log(st,side,`${nm(i)}に薬剤散布。兵アリが耐えた`)}
      else{const c=removeLast(st,i);log(st,side,`${nm(i)}に薬剤散布。「${DEF[c.key].name}」を駆除`)}break}
    case 'barrier':{const i=targets[0];st.points[i].barrier=st.own.d+st.barrierTurns;st.placed[i].d++;log(st,side,`バリア工法を${nm(i)}に施工（${st.barrierTurns}ターン）`);break}

  else{const own=usable(me,selCard);let note='';if(!own)note='相手のカードなので使えません';else if(!selOk)note=st.costOn&&costOf(st,selCard.key)>st.ap?'行動力が足りません':'今は使える場所がありません';
    const how=selOk?(selDef.target==='none'?'「使う」で発動':'光っている場所を選んでください'):'';
    html=`<b>${esc(selDef.name)}</b>　<span class="n">${note}</span>${how?`<span class="muted">　${how}</span>`:''}<span class="d">${esc(selDef.desc)}</span>`}
  $('say').innerHTML=html;
  $('cancel').hidden=!selCard;
  $('useBtn').hidden=!(selOk&&selDef.target==='none');
  $('endBtn').disabled=!my;
  $('autoBtn').setAttribute('aria-pressed',auto?'true':'false')}
function layoutHand(){const cards=[...$('hand').querySelectorAll('.card')];const n=cards.length;if(!n)return;
  const W=$('hand').clientWidth||360,cw=cards[0].offsetWidth||92;
  const step=Math.min(cw*.8,(W-cw-24)/Math.max(1,n-1));const rmax=Math.min(5,22/n);
  cards.forEach((el,i)=>{const off=i-(n-1)/2;const sel=el.classList.contains('sel');
    const x=W/2-cw/2+off*step,r=sel?0:off*rmax,y=sel?-30:Math.abs(off)**2*1.6;
    el.style.setProperty('--x',x+'px');el.style.setProperty('--y',`calc(${y}px + var(--y2,0px))`);el.style.setProperty('--r',r+'deg');el.style.setProperty('--s',sel?1.1:1);el.style.zIndex=sel?50:i+1})}
function render(){if(!st)return;renderSides();renderField();renderHand()}
addEventListener('resize',()=>{if(st){layoutHand();renderSides()}});

/* ---- stage (相手が出したカード・ターン表示) ---- */
async function showPlayed(side,key,t){const d=DEF[key];const where=t&&t.length&&typeof t[0]==='number'?`→ ${POINTS[t[0]].name}`:'';
  $('stage').innerHTML=`<div class="bigcard" style="--c:${cardColor(d)}">${faceHTML(key,true)}</div><div class="cap">${side===st.human?'あなた（オート）':'CPU'}：${esc(d.name)} ${esc(where)}</div>`;
  await sleep(1050);$('stage').innerHTML=''}
async function showBanner(text,side){$('stage').innerHTML=`<div class="banner" style="--sidec:${sideVar(side)}">${esc(text)}</div>`;await sleep(750);$('stage').innerHTML=''}

/* ---- flow ---- */
let initT=1;
function newMatch(human){gameId++;st=newGame(counts,{...opts(),human});initT=Math.max(1,st.decks.t.length);ui={sel:null};fxUntil={};busy=false;$('stage').innerHTML='';closeSheet();nextTurn(gameId,false)}
async function nextTurn(id,started){
  while(st&&!st.winner&&id===gameId){
    if(!started){const before=snap();startTurn(st);markFx(before)}started=false;
    if(st.winner)break;
    const side=st.turnSide,human=side===st.human;
    if(human&&!auto){busy=false;render();await showBanner('あなたのターン',side);if(id===gameId)render();return}
    busy=true;render();await showBanner(human?'あなたのターン（オート）':'相手のターン',side);if(id!==gameId)return;
    for(let g=0;g<40;g++){const b=snap();const res=cpuStep(st,side);if(!res)break;render();await showPlayed(side,res.key,res.t);if(id!==gameId)return;markFx(b);render();await sleep(250);if(id!==gameId)return;if(st.winner)break}
    if(st.winner)break;
    cpuEndTurn(st);endTurn(st);render();await sleep(300);if(id!==gameId)return}
  if(id!==gameId)return;busy=false;render();setTimeout(showResult,700)}
function act(uid,targets){const b=snap();const res=play(st,st.human,uid,targets);markFx(b);ui={sel:null};render();
  if(st.winner){setTimeout(showResult,700);return}
  if(res&&res.reveal)openReveal(res.reveal);if(res&&res.top3&&res.top3.length)openForesight(res.top3,res.deck)}
$('hand').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||b.disabled||busy)return;const uid=+b.dataset.uid;ui={sel:ui.sel===uid?null:uid};render()});
function pick(i){const c=st.hands[st.human].find(x=>x.uid===ui.sel);if(c&&canPlay(st,st.human,c))act(c.uid,[i])}
$('field').addEventListener('click',e=>{const t=e.target.closest('.tile.target');if(t)pick(+t.dataset.pt)});
$('field').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('.tile.target');if(t){e.preventDefault();pick(+t.dataset.pt)}});
$('cancel').onclick=()=>{ui={sel:null};render()};
$('useBtn').onclick=()=>{if(ui.sel)act(ui.sel,[])};
$('endBtn').onclick=()=>{if(!st||st.winner||busy||st.turnSide!==st.human)return;ui={sel:null};
  if(!st.used&&st.hands[st.human].length){openMulligan();return}finishHuman()};
$('autoBtn').onclick=()=>{auto=!auto;ui={sel:null};
  if(auto&&st&&!st.winner&&!busy&&st.turnSide===st.human&&$('overlay').hidden)nextTurn(gameId,true);else render()};
function finishHuman(){refill(st);if(st.hands[st.human].length>HAND_LIMIT){render();openDiscard();return}endTurn(st);render();nextTurn(gameId,false)}

/* ---- sheets ---- */
function openSheet(html){$('sheet').innerHTML=html;$('overlay').hidden=false;const f=$('sheet').querySelector('button');if(f)f.focus();
  $('sheet').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet)}
function closeSheet(){$('overlay').hidden=true;$('sheet').innerHTML=''}
function openStart(){const dWin=$('deckMode').value==='rounds'?'決まったラウンドの間、家を守りきる':'シロアリの山札が尽きるまで家を守りきる';
  openSheet(`<h3>どちらで遊びますか？</h3><div class="pick">
    <button class="d" data-side="d"><b>防除業者</b><span>${dWin}。薬剤散布・バリア工法・ベイト工法で家を守ろう</span></button>
    <button class="t" data-side="t"><b>シロアリ</b><span>8か所のうち5か所を完全侵食しよう。羽アリを女王アリに育てて一気に攻めよう</span></button></div>`);
  $('sheet').querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>newMatch(b.dataset.side))}
function openMenu(){openSheet(`<h3>メニュー</h3><div class="opts">
    <button class="btn" id="mNew">新しく対戦</button><button class="btn" id="mRules">ルール</button><button class="btn" id="mLog">これまでの流れ（ログ）</button><button class="btn" id="mDev">開発用：ルール設定と自動対戦</button></div>
    <button class="btn primary" data-close>閉じる</button>`);
  $('mNew').onclick=openStart;$('mRules').onclick=()=>openSheet($('rulesTpl').innerHTML);$('mLog').onclick=openLog;
  $('mDev').onclick=()=>{closeSheet();$('dev').open=true;$('dev').scrollIntoView({behavior:'smooth'})}}
function openLog(){if(!st)return;openSheet(`<h3>これまでの流れ</h3><ul class="loglist">${st.log.slice(0,60).map(l=>`<li class="${l.cls}">${esc(l.msg)}</li>`).join('')}</ul><button class="btn primary" data-close>閉じる</button>`)}
function showResult(){if(!st||!st.winner)return;const win=st.winner===st.human;
  openSheet(`<div class="result" style="display:flex;flex-direction:column;gap:10px">
    <span class="big ${win?'win':'lose'}">${win?'勝利！':'敗北…'}</span>
    <p><b>${sideName(st.winner)}の勝ち</b><br><span class="muted">${esc(st.winReason)}</span></p>
    <p class="muted">完全侵食 ${completedCount(st)}/${WIN_POINTS}　・　${st.turnNo}ターン</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" id="again">同じ陣営でもう一度</button><button class="btn" id="swapSide">陣営を変えて遊ぶ</button></div></div>`);
  $('again').onclick=()=>newMatch(st.human);$('swapSide').onclick=()=>newMatch(opp(st.human))}
function openMulligan(){const h=st.hands[st.human];
  openSheet(`<h3>1枚も使いませんでした</h3><p class="muted">手札を1枚捨てて1枚引けます（任意）</p>
    <div class="opts">${h.map(c=>`<button class="btn" data-m="${c.uid}">「${esc(DEF[c.key].name)}」を捨てる</button>`).join('')}<button class="btn" id="noM">捨てずにターン終了</button></div>`);
  $('sheet').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mulligan(st,st.human,+b.dataset.m);closeSheet();finishHuman()});
  $('noM').onclick=()=>{closeSheet();finishHuman()}}
function openDiscard(){const h=st.hands[st.human];const need=h.length-HAND_LIMIT;const chosen=new Set();
  const draw_=()=>{openSheet(`<h3>手札が${HAND_LIMIT}枚を超えています</h3><p class="muted">捨てるカードを${need}枚選んでください（${chosen.size}/${need}）</p>
    <div class="opts">${h.map(c=>`<button class="btn ${chosen.has(c.uid)?'on':''}" data-u="${c.uid}">${esc(DEF[c.key].name)}</button>`).join('')}</div>
    <button class="btn primary" id="okDis" ${chosen.size===need?'':'disabled'}>捨ててターン終了</button>`);
    $('sheet').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(chosen.has(u))chosen.delete(u);else if(chosen.size<need)chosen.add(u);draw_()});
    $('okDis').onclick=()=>{chosen.forEach(u=>{const k=h.findIndex(c=>c.uid===u);toDiscard(st,h.splice(k,1)[0])});closeSheet();endTurn(st);render();nextTurn(gameId,false)}};
  draw_()}
function openReveal(keys){openSheet(`<h3>相手の手札</h3><div class="opts">${keys.map(k=>`<div class="btn">${esc(DEF[k].name)}　<span class="muted">${esc(DEF[k].label)}</span></div>`).join('')||'<span class="muted">手札はありません</span>'}</div><button class="btn primary" data-close>閉じる</button>`)}
function openForesight(top,deck){let take=null,order=[];
  const step1=()=>{openSheet(`<h3>予知：山札の上${top.length}枚</h3><p class="muted">手札に加える1枚を選んでください。残りは山札の下に置きます</p>
    <div class="opts">${top.map(c=>`<button class="btn" data-t="${c.uid}">${esc(DEF[c.key].name)}　<span class="muted">${esc(DEF[c.key].label)}</span></button>`).join('')}</div>`);
    $('sheet').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{take=+b.dataset.t;order=top.filter(c=>c.uid!==take);order.length>1?step2():done()})};
  const step2=()=>{openSheet(`<h3>山札の下に置く順番</h3><p class="muted">リストの下にあるカードほど、山札の底になります</p>
    <div class="opts">${order.map((c,k)=>`<div class="row" style="margin:0;justify-content:space-between"><span>${k+1}. ${esc(DEF[c.key].name)}</span><button class="btn" data-up="${k}" ${k?'':'disabled'}>上へ</button></div>`).join('')}</div>
    <button class="btn primary" id="okD">この順で山札の下へ</button>`);
    $('sheet').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const k=+b.dataset.up;[order[k-1],order[k]]=[order[k],order[k-1]];step2()});
    $('okD').onclick=done};
  const done=()=>{resolveForesight(st,st.human,deck,take,order.map(c=>c.uid));closeSheet();render()};
  step1()}
$('menuBtn').onclick=openMenu;
$('feed').onclick=openLog;

/* ---- dev panel ---- */
function buildCfg(){
  const groups=[['シロアリ山札：ヤマトシロアリ','t',k=>k.startsWith('yamato_')],['シロアリ山札：イエシロアリ','t',k=>k.startsWith('ie_')],['シロアリ山札：カンザイシロアリ','t',k=>k.startsWith('kanzai_')],
    ['シロアリ山札：イベント','t',k=>DEF[k].kind==='event'],['シロアリ山札：中立','t',k=>DEF[k].kind==='neutral'],
    ['防除山札：防除・駆除','d',k=>DEF[k].kind!=='neutral'],['防除山札：中立','d',k=>DEF[k].kind==='neutral']];
  let html='';
  groups.forEach(([g,h,fn])=>{html+=`<div class="grp">${g}</div>`;Object.keys(DEFAULT_COUNTS[h]).filter(fn).forEach(k=>{
    const nm=DEF[k].kind==='termite'?CASTES[DEF[k].caste].name:DEF[k].name;const id=`c_${h}_${k}`;
    html+=`<label for="${id}">${esc(nm)}<input type="number" min="0" max="30" id="${id}" data-h="${h}" data-k="${k}" value="${counts[h][k]}"></label>`})});
  html+=`<div class="grp">コスト</div>`;
  Object.keys(DEFAULT_COSTS).forEach(k=>{html+=`<label for="cost_${k}">${esc(COST_LABEL[k])}<input type="number" min="0" max="8" id="cost_${k}" data-cost="${k}" value="${costs[k]}"></label>`});
  $('cfg').innerHTML=html;updTotal()}
const sum=o=>Object.values(o).reduce((a,b)=>a+(+b||0),0);
function updTotal(){$('totT').textContent=sum(counts.t);$('totD').textContent=sum(counts.d)}
$('cfg').addEventListener('input',e=>{const {h,k,cost}=e.target.dataset;if(cost){costs[cost]=Math.max(0,Math.min(8,parseInt(e.target.value)||0));return}if(!k)return;counts[h][k]=Math.max(0,Math.min(30,parseInt(e.target.value)||0));updTotal()});
$('applyBtn').onclick=()=>{newMatch(st?st.human:'d');$('mat').scrollIntoView({behavior:'smooth'})};
const pct=x=>(x*100).toFixed(1)+'%';
$('simBtn').onclick=()=>{$('res').textContent='対戦中…';setTimeout(()=>{const o=opts(),n=1000,r=simulate(counts,n,o);
  const row=(k,v)=>`<tr><th>${k}</th><td class="num">${v}</td></tr>`;
  $('res').innerHTML=`<table>${row('シロアリ側の勝率',pct(r.t/n))}${row('平均ターン数（両者合計）',(r.turns/n).toFixed(1))}${row('平均完全侵食',(r.completed/n).toFixed(2))}
  ${row('1ターンに使うカード（シロアリ／防除）',(r.playT/n).toFixed(1)+' ／ '+(r.playD/n).toFixed(1))}${row('女王アリになった回数',(r.queens/n).toFixed(2))}${row('枯れ木が倒れた割合',pct(r.treeFell/n))}</table>`},20)};
$('cmpBtn').onclick=()=>{$('res').textContent='対戦中…';setTimeout(()=>{const n=1000,base=opts();
  const rows=['shared','splitT','rounds'].map(m=>{const r=simulate(counts,n,{...base,deckMode:m});return `<tr><th>${MODE[m]}</th><td class="num">${pct(r.t/n)}</td><td class="num">${(r.turns/n).toFixed(1)}</td></tr>`}).join('');
  $('res').innerHTML=`<table><tr><th>方式</th><th>シロアリ勝率</th><th>平均ターン</th></tr>${rows}</table>`},20)};
$('cmpCostBtn').onclick=()=>{$('res').textContent='対戦中…';setTimeout(()=>{const n=1000,base=opts();
  const rows=[[false,'コストなし'],[true,'コストあり']].map(([on,l])=>{const r=simulate(counts,n,{...base,costOn:on});return `<tr><th>${l}</th><td class="num">${pct(r.t/n)}</td><td class="num">${(r.turns/n).toFixed(1)}</td></tr>`}).join('');
  $('res').innerHTML=`<table><tr><th>コスト</th><th>シロアリ勝率</th><th>平均ターン</th></tr>${rows}</table>`},20)};

buildCfg();
st=newGame(counts,{...opts(),human:'d'});initT=st.decks.t.length;render();
openStart();
})();
</script>
